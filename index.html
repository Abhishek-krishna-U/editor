<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Design</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }

        .mainContainer {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 24px;
            max-width: 700px;
            width: 100%;
        }

        #myCanvas {
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            background-color: #fafafa;
            cursor: crosshair;
        }

        .img-link {
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: inline-block;
            border-radius: 8px;
            padding: 2px;
        }

        .img-link:hover {
            transform: translateY(-2px);
            opacity: 0.85;
        }

        .img-link.active {
            outline: 3px solid #0d6efd;
        }

        .img-link img {
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 m-0">

    <div class="mainContainer text-center">
        <canvas id="myCanvas" width="600" height="300" class="mb-4"></canvas>

        <div class="d-flex justify-content-center gap-3">
            <a href="#" class="img-link" id="btnCircle">
                <img src="assets/Screenshot 2026-10-01 111036.png" alt="circle" width="60" height="60" class="object-fit-cover">
            </a>
            <a href="#" class="img-link" id="btnRectangle">
                <img src="assets/Screenshot 2026-10-01 111112.png" alt="rectangle" width="60" height="60" class="object-fit-cover">
            </a>
            <a href="#" class="img-link" id="btnLine">
                <img src="assets/Screenshot 2026-10-01 111152.png" alt="line" width="60" height="60" class="object-fit-cover">
            </a>
        </div>
    </div>

    
</body>
</html>
